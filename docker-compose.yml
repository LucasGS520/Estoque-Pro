services:
  estoque-dfeb:
    build: .
    container_name: estoque-dfeb
    restart: unless-stopped
    expose:
      - "8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-dfeb
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - estoque-dfeb
    networks:
      - internal

networks:
  internal:
    driver: bridge
