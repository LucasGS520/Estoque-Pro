events {
    worker_connections 1024;
}

http {
    upstream streamlit {
        server estoque-dfeb:8501;
    }

    # HTTP: redireciona para HTTPS, exceto ACME challenge do certbot
    server {
        listen 80;
        server_name SEU_DOMINIO;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS: proxy reverso para o Streamlit
    server {
        listen 443 ssl;
        server_name SEU_DOMINIO;

        ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Suporte a WebSocket (obrigatório para Streamlit)
        location / {
            proxy_pass http://streamlit;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400;
        }
    }
}
