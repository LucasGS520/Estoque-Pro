events {
    worker_connections 1024;
}

# Configuração global do Nginx
http {
    server_tokens off;

    upstream streamlit {
        server estoque-dfeb:8501;
    }

    # Configuração do servidor para HTTP, redirecionando para HTTPS e permitindo o desafio ACME do Certbot
    server {
        listen 80;
        server_name estoque.marketalert.com.br;

        # Permitir o acesso ao diretório de desafios ACME para a validação do certificado SSL
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirecionar todas as outras requisições para HTTPS 
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Configuração do servidor para HTTPS com proxy reverso para o Streamlit
    server {
        listen 443 ssl;
        server_name estoque.marketalert.com.br;

        # Certificados SSL gerados pelo Certbot
        ssl_certificate /etc/letsencrypt/live/estoque.marketalert.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/estoque.marketalert.com.br/privkey.pem;

        # Configurações de segurança SSL recomendadas
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        client_max_body_size 50m;

        # Proxy para o Streamlit
        location / {
            proxy_pass http://streamlit;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
    }
}
